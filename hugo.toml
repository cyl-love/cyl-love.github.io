baseURL = 'https://cyl-love.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh-CN'
title = 'cyl 的知识库'
copyright = 'cyl'
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 80
timeZone = 'Asia/Shanghai'

[params]
  author = 'cyl_love'
  description = 'Web 安全、CTF 与渗透测试学习笔记'
  github = 'https://github.com/cyl-love'
  avatar = '/avatar.jpg'
  since = 2025

[languages]
  [languages.zh-CN]
    label = '简体中文'
    locale = 'zh-CN'
    weight = 1

[taxonomies]
  category = 'categories'
  tag = 'tags'

[outputs]
  home = ['HTML', 'JSON']

[outputFormats.JSON]
  mediaType = 'application/json'
  baseName = 'index'
  isPlainText = true
  notAlternative = true

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  blog = '/blog/:sections/:slug/'
